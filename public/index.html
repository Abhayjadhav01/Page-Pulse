<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Pulse - URL Auditor</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <span class="logo-icon">&#9889;</span>
        <h1>Page Pulse</h1>
      </div>
      <p class="subtitle">Audit any URL in seconds. Get a comprehensive page report.</p>
    </header>

    <main>
      <section class="audit-form">
        <form id="auditForm">
          <div class="input-group">
            <input
              type="text"
              id="urlInput"
              placeholder="Enter a URL (e.g., https://example.com)"
              autocomplete="url"
              spellcheck="false"
            />
            <button type="submit" id="submitBtn">
              <span class="btn-text">Audit</span>
              <span class="btn-loader" hidden>
                <svg class="spinner" viewBox="0 0 24 24" width="20" height="20">
                  <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="31.4 31.4" stroke-linecap="round" />
                </svg>
              </span>
            </button>
          </div>
          <div id="errorBox" class="error-box" hidden>
            <span class="error-icon">&#9888;</span>
            <span id="errorMessage"></span>
          </div>
        </form>
      </section>

      <section id="reportSection" class="report-section" hidden>
        <div class="report-header">
          <h2>Audit Report</h2>
          <span id="reportUrl" class="report-url"></span>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">HTTP Status</div>
            <div id="statStatus" class="stat-value">200</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Response Time</div>
            <div id="statResponseTime" class="stat-value">100ms</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Word Count</div>
            <div id="statWordCount" class="stat-value">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">H1 Headings</div>
            <div id="statH1Count" class="stat-value">0</div>
          </div>
        </div>

        <div class="details-grid">
          <div class="detail-card">
            <div class="detail-label">Page Title</div>
            <div id="detailTitle" class="detail-value">-</div>
          </div>
          <div class="detail-card">
            <div class="detail-label">Meta Description</div>
            <div id="detailMetaDesc" class="detail-value">-</div>
          </div>
          <div class="detail-card">
            <div class="detail-label">
              Images Missing Alt Text
              <span id="missingAltCount" class="badge">0</span>
            </div>
            <div id="detailMissingAlt" class="detail-value detail-list">
              <em>None — all images have alt text.</em>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>Built with <span class="heart">&hearts;</span> &middot; Page Pulse v1.0</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
